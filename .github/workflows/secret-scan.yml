name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Scan commit history for leaked credentials with Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same version as the local pre-commit scan. The action's default is older
          # and ignores the placeholder allowlist in .gitleaks.toml.
          GITLEAKS_VERSION: 8.30.1
